# ==========================================================
# Thanos Object Store Configuration
# Backend : MinIO (S3 Compatible)
# ==========================================================

type: S3

config:
  # MinIO bucket name
  bucket: thanos

  # MinIO endpoint
  endpoint: minio:9000

  # Access credentials
  access_key: admin
  secret_key: admin123

  # Do not use SSL inside Docker network
  insecure: true

  # Signature Version
  signature_version2: false

  # HTTP Configuration
  http_config:
    idle_conn_timeout: 90s
    response_header_timeout: 2m
    insecure_skip_verify: true

  # Disable encryption for lab
  encrypt_sse: false